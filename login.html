<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>登录 - 易起三学通思政网站</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    .login-box { background: #fff; padding: 30px 40px 30px 40px; border-radius: 10px; box-shadow: 0 2px 16px rgba(0,0,0,0.13);}
    input { display: block; margin: 18px 0; padding: 7px 11px; font-size: 1rem; width: 220px;}
    .hint {color: #E53935; margin-top: 10px; min-height: 20px;}
    button { width: 100%; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>登录 易起三学通思政网站</h2>
    <form onsubmit="return login()">
      <input type="text" id="username" placeholder="用户名" autocomplete="off" required>
      <input type="password" id="password" placeholder="密码" required>
      <button type="submit">登录</button>
      <div class="hint" id="hint"></div>
    </form>
    <p style="font-size:0.95rem; color:#888;">用户名：面<br>密码：666666</p>
  </div>
  <script>
    function login() {
      var user = document.getElementById('username').value.trim();
      var pwd = document.getElementById('password').value;
      if(user==='面' && pwd==='666666'){
        // 登录信息记录到本地Storage
        localStorage.setItem("szt_is_login", "1");
        // 跳转到首页
        window.location.href = "index.html";
        return false;
      } else {
        document.getElementById('hint').innerText = "用户名或密码错误！";
        return false;
      }
    }
    // 禁止用回退返回页面，不让已登录用户回到登录页
    if(localStorage.getItem("szt_is_login")==="1") {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
